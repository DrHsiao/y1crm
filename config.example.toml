# y1crm 組態樣板 — 部署時複製為 config.toml 並填入實際值。
# config.toml 含機密不進版控；本樣板進版控。
# 覆寫優先序：內建預設 < config.toml < 環境變數 Y1CRM_<區段>_<鍵>（如 Y1CRM_STORAGE_BASE_DIR）。

[storage]
# 所有上傳檔的「基地」。移轉/換碟/換機只改這一行。
# 建議放有冗餘/大空間的碟（如 RAID1 掛載點）。
base_dir = "/mnt/raid1/y1crm_uploads"
# 各類檔案的相對子目錄（相對 base_dir）；DB 只存「相對路徑」，換基地資料零改動。
todo_attachments = "todos"
customer_photos  = "photos"
form_images      = "forms"
staff_photos     = "staff"
product_attachments = "products"
hearing_files    = "hearing"

[db]
host     = "localhost"
user     = "root"
password = "CHANGE_ME"
database = "crm1"
charset  = "utf8mb4"

[ocr]
ollama_url = "http://127.0.0.1:11434"
model      = "qwen3.8:27b"

[server]
host = "0.0.0.0"
port = 8004

[line]
channel_id           = "CHANGE_ME"
channel_secret       = "CHANGE_ME"
channel_access_token = ""   # 未設＝開發模式：訊息只記 log 不真發
liff_id              = ""
public_base_url      = "https://example.com"
# 預約提醒排程（前一天推播給客戶，訊息附一顆「確認前往」按鈕）
reminder_enabled     = true
reminder_hour        = 18    # 0–23 整點，每日只跑一次
reminder_days_ahead  = 1     # 1＝提醒明天的預約

[facebook]
# Facebook 粉專（api/fb_page.py）。page_token 未設＝開發模式：發文與回覆只記 log 不真發
page_id       = ""
app_id        = ""
app_secret    = ""        # 機密：驗 webhook 簽章
page_token    = ""        # 機密：Meta 企業管理平台「系統用戶」產生的權杖（不會過期；程式會自己換成粉專權杖，粉專權杖也可以直接貼）
verify_token  = ""        # 自己產生的亂碼（例：python3 -c "import secrets;print(secrets.token_urlsafe(24))"），同一串貼到 Meta 後台
graph_version = "v24.0"
ai_reply      = "draft"   # Messenger 私訊：off／draft（只產草稿）／auto（直接回）；公開留言一律只產草稿

[youtube]
# YouTube 頻道（api/youtube.py）：Google Cloud 專案 y1-youtube 的「電腦版應用程式」OAuth 用戶端
# 填好 client_id、client_secret 後跑一次 sudo venv/bin/python scripts/youtube_auth.py login，
# refresh_token、channel_id 由程式寫進來（不要手動改）；檢查授權：... youtube_auth.py check
client_id     = ""
client_secret = ""        # 機密
refresh_token = ""        # 機密
channel_id    = ""

[ai]
# LINE 客服 AI（本機 ollama-573 純文字實例；⚠ 絕不可送影像，那張卡 vision 推論會崩）
enabled           = true
url               = "http://127.0.0.1:11435"
model             = "qwen3:32b"
timeout_secs      = 30      # 逾時回道歉文；LINE reply token 約 1 分鐘失效，不宜貼邊
auto_reply        = false   # false＝只產草稿給店員審核（第一階段）；true＝直接回客戶
human_hold_hours  = 4       # 人工接手後多久自動交還 AI
max_chars         = 150
# 客戶傳來的圖片：交給好卡（[ocr] 的 11434 / qwen3.8）看圖產草稿，573 絕不碰影像
vision_timeout_secs = 60

[board]
# 店面狀態看板（免登入電視牆）：/board?k=<key>；留空＝看板整組停用
key = ""

[web]
# 官網管理（y1web 官網的關於我們／聽力專欄／好評分享）：上傳的圖片存到官網的 media/uploads
media_dir = "/home/john/y1web/media/uploads"
site_url  = "http://192.168.1.88:8006"   # 備用：正式值在「官網管理 → 官網網址」，換網域改那裡

[social]
# 粉專貼文草稿（api/fb_drafts.py；CRM「粉專貼文」）：本機 AI 每天寫幾則，預設勾選；
# 到 auto_publish 的時間門市沒取消勾選就自動發到粉專（John 2026-11-08）。有紅色錯誤或黃色提醒的不會自動發。
draft_enabled = true     # false＝不自動寫（頁面上仍可按「多寫一則」）
draft_hour    = 6        # 0–23，這個整點之後寫當天的（開店前，避開 LINE 客服的尖峰）
draft_count   = 3
news          = true     # 生活新聞、醫療時事（中央社、衛福部、疾管署、自由時報的 RSS）
auto_publish  = "10:30"  # HH:MM；留空＝不自動發，一律手動按「發佈勾選的」

[imagegen]
# 好評分享沒有圖片的評論，依文意畫示意插圖（api/review_art.py）。只跑在 0002 那張卡（以序號認卡）
enabled = true
python  = "/home/john/media/ghibli/venv/bin/python"   # 要有 torch（支援 sm_70）＋diffusers
hf_home = "/mnt/raid1/llm_models/huggingface"        # SDXL base 的快取（離線載入，不會連網下載）
